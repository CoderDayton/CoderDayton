name: profile

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.toml
      - scripts/**
      - fonts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the PROFILE_TOKEN secret (a token that can read your repos)."
            exit 1
          fi
      - run: python -m unittest discover -s tests
      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/generate.py
      - name: Commit if changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(assets): refresh profile cards"
          git push
